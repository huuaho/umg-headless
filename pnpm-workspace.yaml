packages:
  - 'packages/*'
  - 'apps/*'
# Only install package versions published at least 7 days ago (minutes).
minimumReleaseAge: 10080

allowBuilds:
  sharp: true
  unrs-resolver: true

# Security overrides: Next 16.2 pins postcss 8.4.31 and sharp ^0.34 (both audit-flagged).
overrides:
  'postcss@<8.5.26': 8.5.26
  'sharp@<0.35.0': ^0.35.3
